services:
  db:
    image: postgres:17-alpine
    container_name: productivity-db
    environment:
      POSTGRES_DB: productivity
      POSTGRES_USER: productivity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productivity -d productivity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
